<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>FancyHelper preview — Voxel Mind</title>
<style>
  @font-face { font-family: "Bricolage Grotesque"; font-weight: 700;
    src: url("fonts/BricolageGrotesque-Bold.ttf") format("truetype"); }
  @font-face { font-family: "DM Mono"; font-weight: 400;
    src: url("fonts/DMMono-Regular.ttf") format("truetype"); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { width: 2560px; height: 1280px; overflow: hidden; }
  body {
    width: 1280px; height: 640px; overflow: hidden; zoom: 2;
    font-family: "Noto Sans SC", sans-serif;
    background: #0B0E13; color: #E8EDF4; position: relative;
  }
  #bg { position: absolute; inset: 0; width: 1280px; height: 640px; }

  /* 顶部 GitHub 坐标 */
  .repo { position: absolute; top: 34px; right: 44px; z-index: 3;
    font-family: "DM Mono", monospace; font-size: 13px; letter-spacing: 2.5px;
    color: #66717f; }
  /* 底部细语条 */
  .strip { position: absolute; bottom: 30px; left: 0; width: 100%; z-index: 3;
    display: flex; justify-content: center; }
  .strip span { font-family: "DM Mono", monospace; font-size: 13px; letter-spacing: 4.5px;
    color: #66717f; }
  .fig { position: absolute; bottom: 30px; left: 44px; z-index: 3;
    font-family: "DM Mono", monospace; font-size: 11px; letter-spacing: 2px; color: #3d4654; }

  .masthead { position: absolute; top: 0; left: 0; width: 100%; z-index: 2; text-align: center; }
  /* 品牌锁定：方块标 + 字标，对应游戏内「▌ FancyHelper」品牌头 */
  .lockup { margin-top: 112px; display: flex; align-items: center; justify-content: center; gap: 32px; }
  .mark { width: 66px; flex: none; transform: translateY(12px);
    filter: drop-shadow(0 0 16px rgba(255,181,71,.55)) drop-shadow(0 0 46px rgba(255,181,71,.22)); }
  h1 { font-family: "Bricolage Grotesque", "Noto Sans SC", sans-serif;
    font-weight: 700; font-size: 140px; letter-spacing: -2px; line-height: 1; color: #F2F6FB; }
  .tagline { margin-top: 26px; font-size: 23px; font-weight: 300; letter-spacing: 7px;
    color: #AEBAC8; text-indent: 7px; }
</style>
</head>
<body>
  <canvas id="bg" width="2560" height="1280"></canvas>

  <div class="repo">GITHUB.COM/BAICAIZHALE/FANCYHELPER</div>
  <div class="masthead">
    <div class="lockup">
      <svg class="mark" viewBox="-2 -2 72 106" aria-hidden="true">
        <polygon points="34,0 68,34 34,68 0,34" fill="rgb(255,181,71)"/>
        <polygon points="0,34 34,68 34,102 0,85" fill="rgb(148,105,41)"/>
        <polygon points="68,34 34,68 34,102 68,85" fill="rgb(92,65,26)"/>
        <polygon points="34,0 68,34 34,68 0,34" fill="none" stroke="rgba(255,214,140,.8)" stroke-width="2" stroke-linejoin="round"/>
      </svg>
      <h1>FancyHelper</h1>
    </div>
    <div class="tagline">让 AI 住进你的 Minecraft 服务器</div>
  </div>
  <div class="strip"><span>PAPER 1.18+ &nbsp;·&nbsp; JAVA 17 &nbsp;·&nbsp; MCP &nbsp;·&nbsp; SKILL &nbsp;·&nbsp; I18N</span></div>
  <div class="fig">FIG. 01 — SERVER-SIDE MIND</div>

<script>
// ============ Voxel Mind ============
// 暗线：黑暗方块海里唯一发光的方块，是住进服务器的心智；
// 青色走线是它与玩家之间的信号。
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rnd = mulberry32(7);
const cv = document.getElementById("bg"), ctx = cv.getContext("2d");

ctx.fillStyle = "#0B0E13"; ctx.fillRect(0, 0, 2560, 1280);

// 纸面网格（MC 方块网格作为纸张纹理）
ctx.strokeStyle = "rgba(255,255,255,.022)"; ctx.lineWidth = 1;
for (let x = 0; x <= 2560; x += 32) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 1280); ctx.stroke(); }
for (let y = 0; y <= 1280; y += 32) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(2560, y); ctx.stroke(); }

// ============ 等距体素地形 ============
const S = 34, HALf = S/2, QUAR = S/4;
const NI = 46, NJ = 40, BASEX = 1280, BASEY = 700;
const elev = (i, j) =>
  Math.round(1.2*Math.sin(i*0.42) + 1.1*Math.cos(j*0.37+1.2) + 0.7*Math.sin((i+j)*0.21) + rnd()*0.9);
const shade = (rgb, f) => `rgb(${Math.round(rgb[0]*f)},${Math.round(rgb[1]*f)},${Math.round(rgb[2]*f)})`;
const AMBER = [255, 181, 71];
const GLOW_I = 12, GLOW_J = 2;          // 发光方块的位置
const cubes = [];
for (let i = 0; i < NI; i++) for (let j = 0; j < NJ; j++) {
  let e = elev(i, j);
  const isGlow = (i === GLOW_I && j === GLOW_J);
  if (isGlow) e += 2;                     // 心智高于旷野
  const cx = BASEX + (i - j) * S;
  const cy = BASEY + (i + j) * HALf - e * S;
  const v = 0.92 + rnd()*0.16;
  const top = isGlow ? AMBER : [Math.round(31*v+6), Math.round(40*v+8), Math.round(56*v+10)];
  cubes.push({ cx, cy, top, glow: isGlow, depth: cy });
}
cubes.sort((a, b) => a.depth - b.depth);
function cube(cx, cy, top, fTop, fL, fR) {
  ctx.fillStyle = shade(top, fTop);
  ctx.beginPath();
  ctx.moveTo(cx, cy - S - HALf); ctx.lineTo(cx + S, cy - HALf);
  ctx.lineTo(cx, cy + HALf); ctx.lineTo(cx - S, cy - HALf); ctx.closePath(); ctx.fill();
  ctx.fillStyle = shade(top, fL);
  ctx.beginPath();
  ctx.moveTo(cx - S, cy - HALf); ctx.lineTo(cx, cy + HALf);
  ctx.lineTo(cx, cy + S + HALf); ctx.lineTo(cx - S, cy + S); ctx.closePath(); ctx.fill();
  ctx.fillStyle = shade(top, fR);
  ctx.beginPath();
  ctx.moveTo(cx + S, cy - HALf); ctx.lineTo(cx, cy + HALf);
  ctx.lineTo(cx, cy + S + HALf); ctx.lineTo(cx + S, cy + S); ctx.closePath(); ctx.fill();
}
for (const c of cubes) {
  if (c.glow) {                           // 心智的辉光先铺在旷野上
    const g = ctx.createRadialGradient(c.cx, c.cy - S, 8, c.cx, c.cy - S, 300);
    g.addColorStop(0, "rgba(255,181,71,.34)"); g.addColorStop(1, "rgba(255,181,71,0)");
    ctx.save(); ctx.globalCompositeOperation = "screen";
    ctx.fillStyle = g; ctx.fillRect(c.cx - 320, c.cy - 400, 640, 640); ctx.restore();
  }
  cube(c.cx, c.cy, c.top, 1.0, 0.58, 0.36);
}
// 发光方块的微光顶面描边
const g = cubes.find(c => c.glow);
ctx.strokeStyle = "rgba(255,214,140,.75)"; ctx.lineWidth = 1.4;
ctx.beginPath();
ctx.moveTo(g.cx, g.cy - S - HALf); ctx.lineTo(g.cx + S, g.cy - HALf);
ctx.lineTo(g.cx, g.cy + HALf); ctx.lineTo(g.cx - S, g.cy - HALf); ctx.closePath(); ctx.stroke();

// 数据微尘：从心智升起
[[0,-86,7,.85],[14,-158,5,.55],[-10,-224,4,.32]].forEach(([dx,dy,s,a]) => {
  ctx.fillStyle = `rgba(255,199,102,${a})`;
  ctx.fillRect(g.cx + dx - s/2, g.cy - S + dy, s, s);
});

// 信号走线：沿网格自心智升起，没入标题下方
const T0 = { x: g.cx, y: g.cy - S - 26 };
const path = [T0, { x: T0.x, y: T0.y - 152 }, { x: 2352, y: T0.y - 152 },
              { x: 2352, y: 160 }];
ctx.save();
ctx.strokeStyle = "rgba(48,174,229,.85)"; ctx.lineWidth = 2;
ctx.shadowColor = "rgba(48,174,229,.8)"; ctx.shadowBlur = 7;
ctx.beginPath(); ctx.moveTo(path[0].x, path[0].y);
for (let k = 1; k < path.length; k++) ctx.lineTo(path[k].x, path[k].y);
ctx.stroke();
ctx.shadowBlur = 0;
ctx.fillStyle = "rgba(48,174,229,.9)";
for (const p of path.slice(1, -1)) ctx.fillRect(p.x - 4, p.y - 4, 8, 8);
ctx.fillStyle = "#30AEE5"; ctx.fillRect(path[4].x - 5, path[4].y - 5, 10, 10);
ctx.restore();

// 暗角
const vg = ctx.createRadialGradient(1280, 640, 640, 1280, 640, 1500);
vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(0,0,0,.34)");
ctx.fillStyle = vg; ctx.fillRect(0, 0, 2560, 1280);
</script>
</body>
</html>
